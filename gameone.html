<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Catcher & Grammar Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Marker Felt', 'Arial Rounded MT Bold', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 8px solid #4CAF50;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }
        
        .score-container, .lives-container {
            background: rgba(76, 175, 80, 0.9);
            padding: 12px 24px;
            border-radius: 15px;
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #388E3C;
            box-shadow: 0 4px 0 #388E3C;
        }
        
        .lives-container {
            background: rgba(244, 67, 54, 0.9);
            box-shadow: 0 4px 0 #D32F2F;
        }
        
        #lives span {
            display: inline-block;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            margin: 0 4px;
            box-shadow: inset 0 0 0 2px #f00;
        }
        
        .quiz-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 20;
            border-radius: 20px;
            display: none;
        }
        
        .quiz-question {
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
            color: #388E3C;
            font-weight: bold;
            line-height: 1.4;
            background: #E8F5E9;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #81C784;
        }
        
        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            max-width: 600px;
        }
        
        .quiz-option {
            padding: 16px 28px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 160px;
            box-shadow: 0 5px 0 #388E3C;
        }
        
        .quiz-option:hover {
            background: #66BB6A;
            transform: translateY(-3px);
        }
        
        .quiz-option:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #388E3C;
        }
        
        .game-over, .victory {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 30;
            display: none;
        }
        
        .game-over h2, .victory h2 {
            font-size: 60px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 20px #FFD54F;
        }
        
        .victory h2 {
            color: #FFD54F;
        }
        
        .game-over p, .victory p {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 15px;
        }
        
        .btn {
            background: #FFD54F;
            color: #E65100;
            border: none;
            padding: 16px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 7px 0 #FFB300;
        }
        
        .btn:hover {
            background: #FFE082;
            transform: translateY(-4px);
        }
        
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #FFB300;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #388E3C;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 0 white;
        }
        
        .basket-instructions {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #E65100;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 0 white;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="ui-overlay">
            <div class="score-container">Score: <span id="score">0</span></div>
            <div class="lives-container">Lives: <span id="lives">❤️❤️❤️</span></div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="quiz-container" id="quizContainer">
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Your final score: <span id="finalScore">0</span></p>
            <button class="btn" id="restartBtn">Play Again</button>
        </div>
        
        <div class="victory" id="victoryScreen">
            <h2>Well Done!</h2>
            <p>You mastered "some" and "any"!</p>
            <p>Final score: <span id="victoryScore">0</span></p>
            <button class="btn" id="playAgainBtn">Play Again</button>
        </div>
        
        <div class="basket-instructions">← → Move basket with arrow keys or mouse</div>
        <div class="instructions">Catch food to earn points! Every 5 points, answer a grammar question.</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const quizContainer = document.getElementById('quizContainer');
        const quizQuestion = document.getElementById('quizQuestion');
        const quizOptions = document.getElementById('quizOptions');
        const gameOverScreen = document.getElementById('gameOver');
        const victoryScreen = document.getElementById('victoryScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const victoryScoreElement = document.getElementById('victoryScore');
        const restartBtn = document.getElementById('restartBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        
        canvas.width = 800;
        canvas.height = 600;
        
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let nextQuizScore = 5;
        let quizActive = false;
        let currentQuiz = null;
        
        const foodItems = [
            { name: 'carrot', emoji: '🥕', img: '' },
            { name: 'burger', emoji: '🍔', img: 'https://i.postimg.cc/z3kRKnc5/burger-hamburger-food-svgrepo-com.png' },
            { name: 'sandwich', emoji: '🥪', img: '' },
            { name: 'cheese', emoji: '🧀', img: 'https://i.postimg.cc/z3kRKncr/cheese-food-food-and-restauran-svgrepo-com-1.png' },
            { name: 'banana', emoji: '🍌', img: '' },
            { name: 'chocolate', emoji: '🍫', img: 'https://i.postimg.cc/6ThGnd1h/candy-1-svgrepo-com.png' },
            { name: 'cherries', emoji: '🍒', img: 'https://i.postimg.cc/ykY3Pkwt/cherries-fruit-svgrepo-com.png' },
            { name: 'juice', emoji: '🧃', img: 'https://i.postimg.cc/bdR2kQFM/juice-svgrepo-com.png' }
        ];
        
        const imageCache = {};
        foodItems.forEach(item => {
            if (item.img && item.img.trim() !== '') {
                const img = new Image();
                img.src = item.img;
                imageCache[item.img] = img;
            }
        });
        
        const quizQuestions = [
            { question: "I have ___ cherries.", options: ["some", "any"], correct: "some" },
            { question: "Do you have ___ bananas?", options: ["some", "any"], correct: "any" },
            { question: "Can I have ___ juice, please?", options: ["some", "any"], correct: "some" },
            { question: "She eats ___ carrots every day.", options: ["some", "any"], correct: "some" },
            { question: "We don’t have ___ chocolate.", options: ["some", "any"], correct: "any" },
            { question: "Would you like ___ cheese?", options: ["some", "any"], correct: "some" },
            { question: "He doesn’t eat ___ burgers.", options: ["some", "any"], correct: "any" },
            { question: "I have ___ sandwiches in my bag.", options: ["some", "any"], correct: "some" },
            { question: "Do they have ___ cherry juice?", options: ["some", "any"], correct: "any" },
            { question: "I eat ___ bananas in the morning.", options: ["some", "any"], correct: "some" },
            { question: "Can I have ___ chocolate?", options: ["some", "any"], correct: "some" },
            { question: "She doesn’t eat ___ cheese.", options: ["some", "any"], correct: "any" },
            { question: "We have ___ carrots.", options: ["some", "any"], correct: "some" },
            { question: "Do you eat ___ burgers?", options: ["some", "any"], correct: "any" },
            { question: "I would like ___ cherry juice.", options: ["some", "any"], correct: "some" },
            { question: "He has ___ juice in his bottle.", options: ["some", "any"], correct: "some" },
            { question: "They don’t have ___ sandwiches.", options: ["some", "any"], correct: "any" },
            { question: "Can I have ___ bananas?", options: ["some", "any"], correct: "some" },
            { question: "She eats ___ cherries every day.", options: ["some", "any"], correct: "some" },
            { question: "Do we have ___ chocolate?", options: ["some", "any"], correct: "any" }
        ];
        
        const basket = {
            x: canvas.width / 2 - 60,
            y: canvas.height - 100,
            width: 120,
            height: 80,
            speed: 10
        };
        
        let currentFood = null;
        let lastSpawnTime = 0;
        const spawnInterval = 1800;
        
        function init() {
            score = 0;
            lives = 3;
            gameRunning = true;
            nextQuizScore = 5;
            quizActive = false;
            currentFood = null;
            lastSpawnTime = 0;
            
            scoreElement.textContent = score;
            livesElement.innerHTML = '❤️'.repeat(lives);
            
            gameOverScreen.style.display = 'none';
            victoryScreen.style.display = 'none';
            quizContainer.style.display = 'none';
            
            requestAnimationFrame(gameLoop);
        }
        
        function spawnFood() {
            if (!gameRunning || currentFood) return;
            
            const now = Date.now();
            if (now - lastSpawnTime < spawnInterval) return;
            
            const food = foodItems[Math.floor(Math.random() * foodItems.length)];
            currentFood = {
                x: Math.random() * (canvas.width - 60) + 30,
                y: -60,
                width: 60,
                height: 60,
                food,
                speed: 1.8 + Math.random() * 0.7,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.08
            };
            
            lastSpawnTime = now;
        }
        
        function drawBasket() {
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height - 20);
            
            ctx.strokeStyle = '#388E3C';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(basket.x + basket.width - 10, basket.y);
            ctx.lineTo(basket.x + basket.width + 20, basket.y - 30);
            ctx.stroke();
            
            ctx.fillStyle = '#2E7D32';
            ctx.beginPath();
            ctx.arc(basket.x + 25, basket.y + basket.height - 10, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(basket.x + basket.width - 25, basket.y + basket.height - 10, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#C8E6C9';
            ctx.fillRect(basket.x + 8, basket.y + 8, basket.width - 16, basket.height - 36);
        }
        
        function drawFood() {
            if (!currentFood) return;
            
            const food = currentFood.food;
            ctx.save();
            ctx.translate(currentFood.x + currentFood.width/2, currentFood.y + currentFood.height/2);
            ctx.rotate(currentFood.rotation);
            
            if (food.img && food.img.trim() !== '') {
                const img = imageCache[food.img];
                if (img && img.complete && img.naturalHeight > 0) {
                    ctx.drawImage(img, -currentFood.width/2, -currentFood.height/2, currentFood.width, currentFood.height);
                } else {
                    ctx.font = '50px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(food.emoji, 0, 0);
                }
            } else {
                ctx.font = '50px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(food.emoji, 0, 0);
            }
            
            ctx.restore();
            currentFood.rotation += currentFood.rotationSpeed;
        }
        
        function updateFood() {
            if (!currentFood) return;
            
            currentFood.y += currentFood.speed;
            
            if (currentFood.y + currentFood.height > basket.y && 
                currentFood.x + currentFood.width > basket.x && 
                currentFood.x < basket.x + basket.width) {
                
                score += 1;
                scoreElement.textContent = score;
                currentFood = null;
                
                if (score >= nextQuizScore && !quizActive) {
                    showQuiz();
                }
                
                if (score >= 50) {
                    victory();
                }
                
                return;
            }
            
            if (currentFood.y > canvas.height) {
                currentFood = null;
                lives--;
                livesElement.innerHTML = '❤️'.repeat(lives);
                if (lives <= 0) gameOver();
            }
        }
        
        function showQuiz() {
            quizActive = true;
            gameRunning = false;
            
            currentQuiz = quizQuestions[Math.floor(Math.random() * quizQuestions.length)];
            quizQuestion.textContent = currentQuiz.question;
            
            quizOptions.innerHTML = '';
            currentQuiz.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option);
                quizOptions.appendChild(btn);
            });
            
            quizContainer.style.display = 'flex';
        }
        
        function checkAnswer(selected) {
            quizContainer.style.display = 'none';
            quizActive = false;
            gameRunning = true;
            
            if (selected !== currentQuiz.correct) {
                score = Math.max(0, score - 5);
                scoreElement.textContent = score;
                if (score < nextQuizScore - 5) {
                    nextQuizScore = Math.ceil(score / 5) * 5 + 5;
                }
            } else {
                nextQuizScore += 5;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // === ИСПРАВЛЕННЫЕ ФУНКЦИИ С ОТПРАВКОЙ РЕЗУЛЬТАТА ===
        function victory() {
            gameRunning = false;
            victoryScoreElement.textContent = score;
            victoryScreen.style.display = 'flex';
            
            window.parent.postMessage({
                type: 'gameResult',
                activity: 'board',
                score: score,
                message: 'Well done! 🎉'
            }, '*');
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'flex';
            
            window.parent.postMessage({
                type: 'gameResult',
                activity: 'board',
                score: score,
                message: 'Keep trying... 😟'
            }, '*');
        }
        // === КОНЕЦ ИЗМЕНЕНИЙ ===
        
        function gameLoop() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#E8F5E9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#D1C4E9';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            spawnFood();
            updateFood();
            drawFood();
            drawBasket();
            
            requestAnimationFrame(gameLoop);
        }
        
        window.addEventListener('keydown', (e) => {
            if (!gameRunning || quizActive) return;
            if (e.key === 'ArrowLeft') {
                basket.x = Math.max(0, basket.x - basket.speed);
            }
            if (e.key === 'ArrowRight') {
                basket.x = Math.min(canvas.width - basket.width, basket.x + basket.speed);
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning || quizActive) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            basket.x = Math.max(0, Math.min(canvas.width - basket.width, mouseX - basket.width / 2));
        });
        
        restartBtn.onclick = init;
        playAgainBtn.onclick = init;
        
        init();
    </script>
</body>
</html>
